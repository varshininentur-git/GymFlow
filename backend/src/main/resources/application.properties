spring.application.name=management
spring.datasource.url=jdbc:h2:file:./data/gymdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Keep false for local HTTP. Set SESSION_COOKIE_SECURE=true behind HTTPS in deployment.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
gym.cors.allowed-origins=${GYM_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
